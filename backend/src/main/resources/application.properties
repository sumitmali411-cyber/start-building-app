spring.application.name=task-manager
spring.datasource.url=jdbc:h2:mem:ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
# No default: an in-memory dev database still should not ship a password in git.
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# The H2 console is an unauthenticated web SQL shell. It must never be enabled
# on a deployed instance; turn it on locally with H2_CONSOLE_ENABLED=true.
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Do not leak stack traces or internal messages to API clients.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ------------------------------------------------------------------
# Secrets. Supply these via environment variables; never commit values.
# ------------------------------------------------------------------
payment.razorpay.key_id=${RAZORPAY_KEY_ID:}
payment.razorpay.key_secret=${RAZORPAY_KEY_SECRET:}
payment.adumo.merchant_id=${ADUMO_MERCHANT_ID:}

# Flow JWT signing secret (must be at least 256 bits / 32 chars for HMAC-SHA256).
# Generate one with: openssl rand -base64 48
flow.jwt.secret=${FLOW_JWT_SECRET:}

# Origin allowed to call this API and to be redirected to after payment.
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:4200}
