spring.application.name=task-manager
spring.datasource.url=jdbc:h2:file:./data/ecommercedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Payment Integrations (Test Keys)
# In production, these should be environment variables
payment.razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
payment.razorpay.key_secret=${RAZORPAY_KEY_SECRET:placeholder}
payment.adumo.merchant_id=${ADUMO_MERCHANT_ID:ADM_TEST_placeholder}

# Flow JWT signing secret (must be at least 256 bits / 32 chars for HMAC-SHA256)
flow.jwt.secret=ShopFlowJwtSecret2024MustBe256BitsLongForHmacSha256
