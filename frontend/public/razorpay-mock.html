<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Razorpay Checkout</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #fff;
      color: #333;
      min-height: 100vh;
    }
    .header {
      background: #072654;
      color: white;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .rzp-logo {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .rzp-logo span { color: #2196F3; }
    .amount-display {
      text-align: right;
      font-size: 0.85rem;
      opacity: 0.8;
    }
    .amount-display .amt {
      font-size: 1.3rem;
      font-weight: 700;
      opacity: 1;
    }
    .tabs {
      display: flex;
      border-bottom: 2px solid #f0f0f0;
      background: #f8f9fa;
    }
    .tab {
      flex: 1;
      padding: 0.8rem;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      color: #666;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      transition: all 0.2s;
    }
    .tab.active {
      color: #072654;
      border-bottom-color: #2196F3;
      background: #fff;
      font-weight: 600;
    }
    .tab-content { display: none; padding: 1.5rem; }
    .tab-content.active { display: block; }
    .form-group { margin-bottom: 1rem; }
    label {
      display: block;
      font-size: 0.8rem;
      color: #666;
      margin-bottom: 0.3rem;
      font-weight: 500;
    }
    input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus { border-color: #2196F3; }
    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }
    .btn-pay {
      width: 100%;
      padding: 0.85rem;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 1rem;
      transition: background 0.2s;
    }
    .btn-pay:hover { background: #1976D2; }
    .btn-cancel {
      width: 100%;
      padding: 0.6rem;
      background: transparent;
      color: #999;
      border: none;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.5rem;
      text-decoration: underline;
    }
    .upi-input-group {
      display: flex;
      gap: 0.5rem;
    }
    .upi-input-group input { flex: 1; }
    .btn-verify {
      padding: 0.65rem 1rem;
      background: #072654;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .secure-badge {
      text-align: center;
      font-size: 0.75rem;
      color: #999;
      margin-top: 0.75rem;
    }
    .secure-badge span { color: #4CAF50; }
    .spinner-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.9);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      font-size: 1rem;
      color: #072654;
    }
    .spinner-overlay.show { display: flex; }
    .spin {
      width: 40px; height: 40px;
      border: 4px solid #e0e0e0;
      border-top-color: #2196F3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="header">
    <div class="rzp-logo">Razor<span>pay</span></div>
    <div class="amount-display">
      <div style="opacity:0.7">Amount</div>
      <div class="amt" id="amount-display">...</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('card')">💳 Card</div>
    <div class="tab" onclick="switchTab('upi')">📱 UPI</div>
    <div class="tab" onclick="switchTab('nb')">🏦 NetBanking</div>
  </div>

  <!-- Card Tab -->
  <div class="tab-content active" id="tab-card">
    <div class="form-group">
      <label>Card Number</label>
      <input type="text" id="card-number" placeholder="4111 1111 1111 1111" maxlength="19"
             oninput="formatCard(this)">
    </div>
    <div class="form-group">
      <label>Cardholder Name</label>
      <input type="text" id="card-name" placeholder="John Doe">
    </div>
    <div class="card-row">
      <div class="form-group">
        <label>Expiry (MM/YY)</label>
        <input type="text" id="card-expiry" placeholder="12/27" maxlength="5"
               oninput="formatExpiry(this)">
      </div>
      <div class="form-group">
        <label>CVV</label>
        <input type="password" id="card-cvv" placeholder="•••" maxlength="3">
      </div>
    </div>
    <button class="btn-pay" onclick="pay()">Pay <span id="pay-amount">...</span></button>
    <button class="btn-cancel" onclick="cancel()">Cancel Payment</button>
    <div class="secure-badge"><span>🔒</span> 256-bit SSL secured · Powered by Razorpay</div>
  </div>

  <!-- UPI Tab -->
  <div class="tab-content" id="tab-upi">
    <div class="form-group">
      <label>UPI ID</label>
      <div class="upi-input-group">
        <input type="text" id="upi-id" placeholder="yourname@upi">
        <button class="btn-verify">Verify</button>
      </div>
    </div>
    <button class="btn-pay" onclick="pay()">Pay <span class="pay-amount-upi">...</span></button>
    <button class="btn-cancel" onclick="cancel()">Cancel Payment</button>
    <div class="secure-badge"><span>🔒</span> 256-bit SSL secured · Powered by Razorpay</div>
  </div>

  <!-- NetBanking Tab -->
  <div class="tab-content" id="tab-nb">
    <p style="color:#666; font-size:0.9rem; margin-bottom:1rem;">Select your bank to proceed:</p>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.5rem; margin-bottom:1rem;">
      <div onclick="pay()" style="padding:0.75rem; border:1.5px solid #ddd; border-radius:6px; text-align:center; cursor:pointer; font-size:0.85rem;" onmouseover="this.style.borderColor='#2196F3'" onmouseout="this.style.borderColor='#ddd'">HDFC Bank</div>
      <div onclick="pay()" style="padding:0.75rem; border:1.5px solid #ddd; border-radius:6px; text-align:center; cursor:pointer; font-size:0.85rem;" onmouseover="this.style.borderColor='#2196F3'" onmouseout="this.style.borderColor='#ddd'">ICICI Bank</div>
      <div onclick="pay()" style="padding:0.75rem; border:1.5px solid #ddd; border-radius:6px; text-align:center; cursor:pointer; font-size:0.85rem;" onmouseover="this.style.borderColor='#2196F3'" onmouseout="this.style.borderColor='#ddd'">SBI</div>
      <div onclick="pay()" style="padding:0.75rem; border:1.5px solid #ddd; border-radius:6px; text-align:center; cursor:pointer; font-size:0.85rem;" onmouseover="this.style.borderColor='#2196F3'" onmouseout="this.style.borderColor='#ddd'">Axis Bank</div>
    </div>
    <button class="btn-cancel" onclick="cancel()">Cancel Payment</button>
    <div class="secure-badge"><span>🔒</span> 256-bit SSL secured · Powered by Razorpay</div>
  </div>

  <div class="spinner-overlay" id="spinner">
    <div class="spin"></div>
    <div>Processing payment...</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const amount = params.get('amount') || '0.00';
    const orderId = params.get('orderId') || 'order_mock';

    document.getElementById('amount-display').textContent = '$' + parseFloat(amount).toFixed(2);
    document.querySelectorAll('#pay-amount, .pay-amount-upi').forEach(el => {
      el.textContent = '$' + parseFloat(amount).toFixed(2);
    });

    function switchTab(name) {
      document.querySelectorAll('.tab').forEach((t, i) => {
        t.classList.toggle('active', ['card','upi','nb'][i] === name);
      });
      document.querySelectorAll('.tab-content').forEach(tc => tc.classList.remove('active'));
      document.getElementById('tab-' + name).classList.add('active');
    }

    function formatCard(input) {
      let v = input.value.replace(/\D/g, '').substring(0, 16);
      input.value = v.replace(/(.{4})/g, '$1 ').trim();
    }

    function formatExpiry(input) {
      let v = input.value.replace(/\D/g, '');
      if (v.length >= 2) v = v.substring(0,2) + '/' + v.substring(2);
      input.value = v;
    }

    function pay() {
      document.getElementById('spinner').classList.add('show');
      setTimeout(() => {
        const paymentId = 'pay_mock_' + Math.random().toString(36).substring(2, 12);
        window.parent.postMessage({ type: 'rzp-payment-success', paymentId, orderId }, '*');
      }, 1500);
    }

    function cancel() {
      window.parent.postMessage({ type: 'rzp-payment-cancel' }, '*');
    }
  </script>
</body>
</html>
